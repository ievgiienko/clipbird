name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6

      # Browser bundles are large and change only with the Playwright version.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('gradle/libs.versions.toml') }}

      # --with-deps also installs the system packages the bundles link against,
      # which is what the runner is missing. On a developer machine the same
      # gap is closed by scripts/setup-e2e.sh instead.
      - run: ./gradlew installPlaywrightBrowsers -PplaywrightWithDeps

      - run: ./gradlew e2eTest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: build/reports/tests/e2eTest
