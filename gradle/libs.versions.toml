# Single source of truth for dependency and plugin versions.
# Referenced from build.gradle.kts via the `libs` accessor.
# Use ./gradlew dependencyUpdates to surface candidates.

[versions]
# ── Build plugins ────────────────────────────────────────────────────────────
springBoot           = "4.1.2"
# Boot 4.1.1 pins Tomcat 11.0.24, which carries three critical advisories in the
# DIGEST and FORM authentication paths (GHSA-9xv2-5v5q-p794, GHSA-gcx9-497g-6cp6,
# GHSA-h3x4-894j-xpx5), all fixed in 11.0.25. This project does not use container
# authentication, so the exposure is theoretical, but the bump costs nothing.
tomcat               = "11.0.25"
springDependencyMgmt = "1.1.7"
versionsPlugin       = "0.66.0"

# ── Pinned libraries ─────────────────────────────────────────────────────────
# Everything Spring manages is versionless below and comes from the Boot BOM.
# Only artifacts outside that BOM need a number here.
#
# telegrambots: 6.9.7.1 is the last release published under these coordinates.
# The project moved to split starters (longpolling / webhook) from 7.x, which is
# a code change, not a version bump.
telegrambots         = "6.9.7.1"
# playwright: the Java binding trails the Node line by several minors. Bumping
# it pulls new browser revisions, so it moves on its own, not with the app.
playwright           = "1.64.0"

[libraries]
# ── Spring ───────────────────────────────────────────────────────────────────
spring-boot-starter-web        = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-websocket  = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-data-jpa   = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-security   = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-flyway             = { module = "org.springframework.boot:spring-boot-flyway" }

# ── Persistence ──────────────────────────────────────────────────────────────
flyway-core     = { module = "org.flywaydb:flyway-core" }
flyway-mysql    = { module = "org.flywaydb:flyway-mysql" }
mysql-connector = { module = "com.mysql:mysql-connector-j" }

# ── Integrations ─────────────────────────────────────────────────────────────
telegrambots-spring-boot-starter = { module = "org.telegram:telegrambots-spring-boot-starter", version.ref = "telegrambots" }

# ── Test ─────────────────────────────────────────────────────────────────────
# spring-boot-webmvc-test is a separate artifact in Boot 4; @AutoConfigureMockMvc
# does not come with spring-boot-starter-test any more.
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-webmvc-test  = { module = "org.springframework.boot:spring-boot-webmvc-test" }
spring-security-test     = { module = "org.springframework.security:spring-security-test" }
h2                       = { module = "com.h2database:h2" }
playwright               = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }

[plugins]
spring-boot                  = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyMgmt" }
versions                     = { id = "io.github.ben-manes.versions", version.ref = "versionsPlugin" }
