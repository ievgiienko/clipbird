spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration

app:
  clipboard:
    id-length: 8
    ttl-hours: 24
    max-text-size-bytes: 10485760
    max-file-size-bytes: 524288000
    chunk-size-bytes: 1048576
    min-chunk-size-bytes: 262144
    max-chunk-size-bytes: 5242880
  cleanup:
    interval-seconds: 3600
    transfer-timeout-seconds: 600
    hard-delete-enabled: true
    hard-delete-delay-hours: 168
  rate-limit:
    max-creates-per-minute: 100
    max-opens-per-minute: 100
