spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:secure_clipboard}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  clipboard:
    id-length: ${CLIPBOARD_ID_LENGTH:8}
    ttl-hours: ${CLIPBOARD_TTL_HOURS:24}
    max-text-size-bytes: ${MAX_TEXT_SIZE:10485760}
    max-file-size-bytes: ${MAX_FILE_SIZE:524288000}
    chunk-size-bytes: ${CHUNK_SIZE:1048576}
    min-chunk-size-bytes: ${MIN_CHUNK_SIZE:262144}
    max-chunk-size-bytes: ${MAX_CHUNK_SIZE:5242880}
    max-devices: 10
  cleanup:
    interval-seconds: ${CLEANUP_INTERVAL:300}
    transfer-timeout-seconds: ${TRANSFER_TIMEOUT:600}
    hard-delete-enabled: ${HARD_DELETE_ENABLED:true}
    hard-delete-delay-hours: ${HARD_DELETE_DELAY_HOURS:168}
  rate-limit:
    max-creates-per-minute: ${RATE_LIMIT_CREATES:10}
    max-opens-per-minute: ${RATE_LIMIT_OPENS:30}

logging:
  level:
    com.secureclipboard: INFO
    org.springframework.web.socket: INFO
