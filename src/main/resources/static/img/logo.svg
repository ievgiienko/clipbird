<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Bird icon -->
  <g transform="translate(4, 4)">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <!-- Body -->
      <path d="M16 38c-4-2-7-6-7-11 0-3 1-5.5 3-7.5C14.5 17 18 15 22 15c2 0 3.5.5 5 1.5l4-4c1-1 2.5-1 3.5 0s1 2.5 0 3.5l-3.5 3.5c1.5 2.5 2 5.5 1.5 8.5-.5 3-2 5.5-4.5 7.5-2 1.5-4.5 2.5-7 2.5-2 0-3.8-.3-5-1z" fill="url(#birdGrad)" />
      <!-- Wing -->
      <path d="M20 22c3-1 6-.5 8.5 1.5l-5 5c-2-1.5-4-2-6-1.5 0-2 1-3.5 2.5-5z" fill="rgba(255,255,255,0.25)" />
      <!-- Eye -->
      <circle cx="19" cy="22" r="2" fill="white" />
      <!-- Beak -->
      <path d="M12 24l-4-1.5 4-1.5c-.5 1-.5 2 0 3z" fill="#FFB74D" />
      <!-- Tail feathers -->
      <path d="M33 26c2 0 4.5-.5 6-2 1-1 1.5-2.5 1.5-4-1 1.5-2.5 2.5-4.5 3-1.5.3-3 .2-4 0 .5 1.2 1 2.2 1 3z" fill="url(#birdGrad)" opacity="0.7" />
      <!-- Clipboard detail - small rectangle on wing area -->
      <rect x="22" y="26" width="5" height="6" rx="1" fill="rgba(255,255,255,0.15)" />
      <rect x="23" y="28" width="3" height="0.8" rx="0.4" fill="rgba(255,255,255,0.25)" />
      <rect x="23" y="30" width="2" height="0.8" rx="0.4" fill="rgba(255,255,255,0.25)" />
      <defs>
        <linearGradient id="birdGrad" x1="10" y1="15" x2="35" y2="40" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4FC3F7" />
          <stop offset="100%" stop-color="#2196F3" />
        </linearGradient>
      </defs>
    </svg>
  </g>
  <!-- Text -->
  <text x="62" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#e4e6ef">
    Clip<tspan fill="#4FC3F7">Bird</tspan>
  </text>
</svg>
